# CI for hq. Triggered on main.
# Stage "check" runs the test suite, the linter, and the security scans
# in parallel. Stage "build" compiles the release binaries for all
# supported platforms and publishes them as a pipeline artifact.
trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: check
    displayName: Check
    jobs:
      - job: tests
        displayName: Tests
        steps:
          - task: UseGo@1
            displayName: Use Go 1.27
            inputs:
              versionSpec: '1.27'

          - script: go test ./...
            displayName: Run tests

      - job: lint
        displayName: Lint
        steps:
          - task: UseGo@1
            displayName: Use Go 1.27
            inputs:
              versionSpec: '1.27'

          - script: |
              go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
              "$(go env GOPATH)/bin/golangci-lint" run --max-issues-per-linter 0 --max-same-issues 0 ./...
            displayName: Install and run golangci-lint v2.15.0

      - job: security
        displayName: Security
        steps:
          - task: UseGo@1
            displayName: Use Go 1.27
            inputs:
              versionSpec: '1.27'

          # Reachable vulnerabilities in the module graph and in the
          # standard library, against the official Go vuln database.
          - script: |
              go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
              "$(go env GOPATH)/bin/govulncheck" ./...
            displayName: Check dependencies (govulncheck v1.9.0)

          # Static analysis of insecure usage in Go source.
          - script: |
              go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
              "$(go env GOPATH)/bin/gosec" -quiet ./...
            displayName: Static security analysis (gosec v2.30.0)

          # Secrets accidentally committed to the git history.
          - script: |
              curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar xz -C "$(go env GOPATH)/bin"
              "$(go env GOPATH)/bin/gitleaks" detect --redact --no-banner
            displayName: Scan history for secrets (gitleaks v8.30.1)

  - stage: build
    displayName: Build and publish
    dependsOn: check
    jobs:
      - job: build
        displayName: Build
        steps:
          - task: UseGo@1
            displayName: Use Go 1.27
            inputs:
              versionSpec: '1.27'

          - script: ./build.sh
            displayName: Build all platforms

          - task: PublishBuildArtifacts@1
            displayName: Publish dist artifact
            inputs:
              PathtoPublish: dist
              ArtifactName: hq-dist
