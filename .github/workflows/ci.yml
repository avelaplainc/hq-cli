# CI for hq. Mirrors pipelines/ci.yml: tests, lint, and security checks
# run in parallel; build then compiles every release platform and
# publishes dist/ as a run artifact.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # The local gate: unformatted files must not reach main.
      - run: |
          files=$(gofmt -l .)
          test -z "$files" || { echo "gofmt needed:"; echo "$files"; exit 1; }
      - run: go vet ./...
      - run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run --max-issues-per-linter 0 --max-same-issues 0 ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: gitleaks scans the git log, not only this checkout.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # Reachable vulnerabilities in the module graph and in the
      # standard library, against the official Go vuln database.
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      # Static analysis of insecure usage in Go source.
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -quiet ./...
      # Secrets accidentally committed to the git history.
      - run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar xz -C "$(go env GOPATH)/bin"
          "$(go env GOPATH)/bin/gitleaks" detect --redact --no-banner

  build:
    name: Build
    needs: [tests, lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hq-dist
          path: dist
          if-no-files-found: error
