# Release: on a v* tag, build every platform and attach the binaries
# and SHA256SUMS to the GitHub release for that tag.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: ./build.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "hq $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
